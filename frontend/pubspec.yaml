name: notulen
description: Indonesian meeting notes app with speech-to-text
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0

  # Audio Recording
  record: ^5.0.4
  flutter_sound: ^9.2.13
  permission_handler: ^11.1.0
  path_provider: ^2.1.1

  # File Handling
  file_picker: ^6.1.1
  path: ^1.8.3

  # API & Networking
  http: ^1.1.2
  dio: ^5.4.0

  # Data Models
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # UI Components
  intl: ^0.18.1
  flutter_markdown: ^0.6.18
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700
