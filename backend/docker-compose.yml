version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - DATABASE_URL=sqlite:///./data/notulen.db
      - DEBUG=True
      - WHISPER_MODEL=base
      - USE_INDONESIAN_MODEL=True
    restart: unless-stopped
    # Uncomment below for GPU support
