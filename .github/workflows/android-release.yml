name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'android-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/notulen-${{ steps.get_version.outputs.VERSION }}.apk

      - name: Rename AAB
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/notulen-${{ steps.get_version.outputs.VERSION }}.aab

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Notulen Android App - ${{ steps.get_version.outputs.VERSION }}

          ### What's New
          - AI-powered meeting notes with speech-to-text
          - Automatic meeting summarization
          - Action items and key points extraction
          - Offline support with local database
          - Material 3 design with Jetpack Compose

          ### Installation
          Download the APK file and install on your Android device (Android 8.0+)

          ### Requirements
          - Android 8.0 (API 26) or higher
          - Microphone permission for recording
          - Internet connection for transcription and AI summaries

          ### Backend Setup
          This app requires the Notulen backend API to be running.
          See: https://github.com/taufiksoleh/notulen
          EOF

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk-${{ steps.get_version.outputs.VERSION }}
          path: android/app/build/outputs/apk/release/notulen-${{ steps.get_version.outputs.VERSION }}.apk
          retention-days: 90

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v3
        with:
          name: release-bundle-${{ steps.get_version.outputs.VERSION }}
          path: android/app/build/outputs/bundle/release/notulen-${{ steps.get_version.outputs.VERSION }}.aab
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/release/notulen-${{ steps.get_version.outputs.VERSION }}.apk
            android/app/build/outputs/bundle/release/notulen-${{ steps.get_version.outputs.VERSION }}.aab
          body_path: android/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Play Store (Optional)
        if: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.notulen
          releaseFiles: android/app/build/outputs/bundle/release/notulen-${{ steps.get_version.outputs.VERSION }}.aab
          track: production
          status: completed
        continue-on-error: true
